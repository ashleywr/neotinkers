/*
 * Tinkers Construct - NeoForge 1.21.1 port build file
 * Original ForgeGradle build by boni, Sunstrike, ProgWML6 (Slime Knights).
 * Converted to ModDevGradle for NeoForge 1.21.1.
 */

plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'io.freefair.lombok' version '8.10'
}

group = 'slimeknights.tconstruct'
// version = <mc>-<upstream Tinkers version>-v<fork version>, e.g. 1.21.1-3.11.2-v1.0
version = "${minecraft_version}-${mod_version}-v${fork_version}"
base {
    archivesName = 'NeoTinkers'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

repositories {
    mavenCentral()
    maven { name = 'BlameJared (JEI, Immersive Engineering, CraftTweaker)'; url = 'https://maven.blamejared.com' }
    maven { name = 'Dogforce Games (JSON Things)'; url = 'https://www.dogforce-games.com/maven/' }
    maven { name = 'TerraformersMC (EMI)'; url = 'https://maven.terraformersmc.com/releases' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth (Crafting Tweaks, Balm, Jade, MmmMmmMmmMmm)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll(
                '--mod', 'tconstruct',
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath,
                '--existing-mod', 'mantle'
            )
        }
    }

    mods {
        tconstruct {
            sourceSet sourceSets.main
        }
    }

    // runs the unit tests with Minecraft and NeoForge on the classpath
    unitTest {
        enable()
        testedMod = mods.tconstruct
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
    // debug resources help develop the mod, they are not shipped
    exclude 'assets/tconstruct/debug'
}

// TEMPORARY: integrations whose 3rd-party APIs are not yet available for 1.21.1
// (their compileOnly deps below are commented out). Excluded so the core mod builds;
// re-enable each source tree when its dependency is restored in `dependencies`.
//  - jei: recipe viewer (mezz.jei)
//  - DietPlugin: com.illusivesoulworks.diet
sourceSets.main.java {
    // jei: ported to the 1.21.1 JEI 19.x API and re-enabled (deps below).
    exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
}

dependencies {
    // Mantle: substituted by the ../Mantle composite build (see settings.gradle).
    implementation "slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}"

    // --- Optional integrations. Re-enable each as its integration package is ported. ---
    // JEI (recipe viewer) - ported to JEI 19.x for 1.21.1
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // EMI (recipe viewer) - native plugin in slimeknights.tconstruct.plugin.emi
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    // Crafting Tweaks - grid buttons on the crafting station
    compileOnly "maven.modrinth:crafting-tweaks:${crafting_tweaks_version}"
    runtimeOnly "maven.modrinth:crafting-tweaks:${crafting_tweaks_version}"
    runtimeOnly "maven.modrinth:balm:${balm_version}"
    // Jade has no plugin, it reads our capabilities; on the dev runtime to check tank and inventory tooltips
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    // JSON Things - fluid blocks, part casts and tool items for packs
    compileOnly "dev.gigaherz.jsonthings:JsonThings-${minecraft_version}:${json_things_version}"
    // Immersive Engineering - chemthrower fluid effects and shield disabling on illagers
    compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${minecraft_version}-${ie_version}"
    // MmmMmmMmmMmm - shield disabling on target dummies
    compileOnly "maven.modrinth:mmmmmmmmmmmm:${dummmmmmy_version}"

    // Unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

test {
    useJUnitPlatform()
    // the unit test runner loads the full game, which does not fit in the default 512M heap
    maxHeapSize = '2G'
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version          : version,
        mod_version      : mod_version,
        fork_version     : fork_version,
        loader_range     : loader_range,
        minecraft_range  : minecraft_range,
        neoforge_range   : neoforge_range,
        mantle_range     : mantle_range,
        jei_range        : jei_range,
        json_things_range: json_things_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Tinkers' Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights"
        ])
    }
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
